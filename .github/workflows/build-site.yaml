name: build-site

on:
  # Triggers the workflow on push events but only for the "main" branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Least privilege. The build only reads the repository; the deploy needs no
# repository access at all. Nothing here can write to the repo, which is what
# publishing via a force-push to gh-pages used to require.
permissions:
  contents: read

# One Pages deployment at a time. Unlike a build, a deployment already in
# flight should not be cancelled part-way, so a queued run waits instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checks out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7
        env:
          GIT_CLONE_PROTECTION_ACTIVE: false
        with:
          lfs: true
          fetch-depth: 0   # the build derives the 'last updated' date from git history

      # Sets up a recent version of Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      # Validate data/*.json
      - name: Validate data/*.json
        run: |
          for f in data/*.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"
          done

      # Same regression tests build-check.yaml runs, so a broken build never
      # reaches the Pages deployment
      - name: Audit helper tests
        run: python3 scripts/test_audit.py

      - name: Check the palette against the canon
        run: python3 docs/check_tokens.py

      # Build site with webpack
      - name: Build static site
        run: |
          npm ci
          npm run build
          touch dist/.nojekyll
          echo "astrostatuoft.com" > dist/CNAME

      # Check expected pages were produced, before we publish them. The same
      # script build-check.yaml runs, so this can never check less than it does.
      - name: Check expected pages were produced
        run: ./scripts/check_build_output.sh --publish dist

      # dist/ is handed to Pages as an artifact rather than force-pushed to a
      # branch. include-hidden-files is required: it defaults to false, and
      # .nojekyll is a dotfile.
      - name: Upload dist/ as a Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # workflow_dispatch lets an operator pick any ref, so without this a manual
    # run from a feature branch would publish that branch to the live site. The
    # build above still runs on any ref, which is what makes a manual dry run
    # on a branch useful; only publishing is pinned to main.
    if: github.ref == 'refs/heads/main'

    # Only the deploy job gets the Pages scopes, and it needs no repo access.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      # Unlike a branch push, this fails loudly if Pages is disabled or
      # misconfigured, rather than reporting success while the site is dark.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # And this closes the loop: a green build that isn't actually being
      # served is the failure this whole workflow exists to catch.
      - name: Smoke-test the live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -uo pipefail
          if [ -z "${PAGE_URL:-}" ]; then
            echo "::error::deploy-pages reported no page_url; nothing to verify"
            exit 1
          fi
          base="${PAGE_URL%/}"
          echo "Deployed to $base"

          attempts=10

          # A status code alone is not proof a page was served: an empty 200
          # would satisfy `! grep 'Site not found'` precisely because grep finds
          # nothing in an empty file. So the body must also be non-empty, carry
          # a site-specific marker, and be a complete document.
          marker='astrostatuoft'

          check() {
            url="$1"
            for i in $(seq 1 "$attempts"); do
              body="$(mktemp)"
              # Cache-buster and no-cache so a stale edge copy cannot pass for us.
              code="$(curl -sS -o "$body" -w '%{http_code}' \
                        -H 'Cache-Control: no-cache' --max-time 20 \
                        "$url?ci=${GITHUB_RUN_ID}-$i" 2>/dev/null || echo 000)"

              reason=""
              if [ "$code" != "200" ]; then
                reason="HTTP $code"
              elif [ ! -s "$body" ]; then
                reason="200 with an empty body"
              elif grep -qF 'Site not found' "$body"; then
                reason="200 serving GitHub's 'Site not found' page"
              elif ! grep -qF "$marker" "$body"; then
                reason="200 but no '$marker' marker - is this our site?"
              elif ! grep -qF '</html>' "$body"; then
                reason="200 but truncated (no closing </html>)"
              fi

              if [ -z "$reason" ]; then
                echo "  $url -> 200 ✓"
                rm -f "$body"
                return 0
              fi

              rm -f "$body"
              echo "  $url -> $reason (attempt $i/$attempts)"
              if [ "$i" -lt "$attempts" ]; then sleep 15; fi
            done
            return 1
          }

          rc=0
          for path in "/" "/people.html" "/research.html"; do
            check "$base$path" || {
              echo "::error::$base$path is not being served after a successful deploy"
              rc=1
            }
          done
          exit "$rc"
